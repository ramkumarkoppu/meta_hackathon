# Keep uv's download/build cache inside this project folder (E:\work_laptop).
# The README's rebuild steps install the Python interpreter into .uv\python by setting
# UV_PYTHON_INSTALL_DIR first (uv has no config key for that).
cache-dir = ".uv/cache"
# E: is exFAT (no hardlinks/symlinks/junctions), so always copy files into the venv.
link-mode = "copy"
