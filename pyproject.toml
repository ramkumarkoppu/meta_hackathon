[project]
name = "nanokvm-mcp"
version = "0.1.0"
description = "AI help for a locked computer through a Sipeed NanoKVM-USB: Muse Glimmer reads the screen on the local GPU, Muse Spark gets only redacted text, and approved edits are typed back"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "opencv-python-headless>=4.14,<5",
    "cv2-enumerate-cameras>=1.4,<2",
    "pyserial>=3.5,<4",
    "numpy>=2.0",
]

[project.scripts]
nanokvm = "nanokvm_mcp.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
