# Settings for the Work-laptop NanoKVM bridge. Every line is optional; the values shown
# (commented out) are the defaults, or examples where the comment names the default or says
# when to use them. A misspelt name is ignored without warning, so check the spelling.
# Environment variables NANOKVM_<NAME> override this file. Every setting: src\nanokvm_mcp\config.py.
# After editing: run `.venv\Scripts\nanokvm.exe stop` (the service restarts on the next tool call)
# and start a new Claude Code conversation (its MCP server reads this file only when it starts).

# --- keyboard / mouse ---
# SECURE MODE: Claude may type/click on the Work laptop, but
#   * only while the NanoKVM's TARGET USB-C (cable 4) is plugged in - unplug it = physically view-only;
#   * Claude Code asks you before EVERY keyboard/mouse action, even in auto mode (confirm_actions).
# For strict view-only, set control = false, run `nanokvm stop` and start a new Claude conversation.
control = true
confirm_actions = true
keyboard_layout = "uk"       # Windows keyboard layout of the Work laptop: "uk" or "us"
# serial_port = "COM5"       # default: auto-detect the NanoKVM's serial port by serial_ids (below)
serial_ids = "1A86:7523,1A86:55D3"  # CH340 (other NanoKVM-USB units) and CH343 (this unit; its edition is unconfirmed)

# --- video ---
# capture_width = 1920
# capture_height = 1080
# capture_fps = 30
shot_width = 1456            # screenshot width Claude sees (= pointer coordinate space); 1456 keeps code legible
                             # (capped to avoid downscaling: 1456 is the widest at 16:9; at 16:10 it gives 1370)
# capture_fourcc = "YUY2"    # default "MJPG"; try on hardware day: uncompressed = sharpest code text (needs USB 3)
# viewer_fps = 30            # live view frame rate (default 15)
# viewer_width = 1920        # live view width (default 1920 = 1:1 with the capture)
# viewer_quality = 90        # live view JPEG quality (default 90)
# display_aspect = "16:10"   # only if the Work laptop desktop is 16:10 and the picture looks squashed
# region = "96,0,1728,1080"  # manual active area x,y,w,h in capture pixels (normally use `calibrate`)

# --- screen sharing ---
# share_minutes = 60         # default share length (minutes); Claude may ask for 1-480, shown in the prompt
# saved_image_minutes = 5    # screenshots saved by the nanokvm command are deleted after this long (min 1)

# --- service ---
# port = 8765                # live view: http://127.0.0.1:8765/?t=<token from .run\token>
                             # (run `nanokvm stop` BEFORE changing it, or the old service keeps the NanoKVM busy)
# idle_exit_min = 60         # stop the background service after this many idle minutes (0 = never)
